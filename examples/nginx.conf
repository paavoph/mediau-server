# Web server that is available only to this host on port 8080 to run PHP scripts that respond to redirected requests
server {
  listen 127.0.0.1:8080 default_server;
  root /var/www/html;
  index index.html index.php;

  # Enable PHP
  # fastcgi_pass refers to a symbolic link that points to the correct version of PHP
  location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
  }

}


# iTunes search service that responds to artwork searches, and returns artwork images referenced in responses
server {
  listen 80;
  server_name itunes.apple.com;

  location = /search {
    proxy_pass http://127.0.0.1:8080/search.php?$args;
  }

  location = /artwork {
    proxy_pass http://127.0.0.1:8080/artwork.php?$args;
  }

}


# MediaU server that redirects MediaU requests from radios to local services
server {
  listen 80 default_server;


  # PROXY
  # Local proxy related requests

  # Proxy index to local web UI
  location = / {
    proxy_pass http://127.0.0.1:8080/index.php;
  }

  # Also proxy /assets/ and /cache folders
  location ~ ^/(assets|cache) {
    proxy_pass http://127.0.0.1:8080$request_uri;
  }


  # MEDIAU
  # Requests by MediaU devices from here onward

  # Get current UNIX timestamp
  location = /cgi-bin/srvtime {
    proxy_pass http://127.0.0.1:8080/time.php?$args;
  }

  # Check for updates
  location ~ ^/cgi-bin/(GetSW|GetSWNew) {
    proxy_pass http://127.0.0.1:8080/update.php?$args;
  }

  # Location check to get the local city (and timezone info?)
  location = /cgi-bin/getcity {
    proxy_pass http://127.0.0.1:8080/geolocate.php?$args;
  }

  # Retrieval of favorites shown in the MediaU section
  location /embedded/GetMyMediaU_sn4.php {
    proxy_pass http://127.0.0.1:8080/favorites.php?$args;
  }

  # Unknown purpose: sets magicSSO cookie, but the cookie does not appear to have any effect
  location = /sso/ssologin.php {
    proxy_pass http://127.0.0.1:8080/sso.php?$args;
  }

  # Listening time reporting: captures device ID, channel ID, and listening time reported by the radio
  location /listen/listenRadio.php {
    proxy_pass http://127.0.0.1:8080/report.php?$args;
  }

  # Request streaming URL for the provided channel ID and device ID; server responds with an ASX file
  location ~ ^/(embedded/)?playURL(_sleep)?\.php$ {
    proxy_pass http://127.0.0.1:8080/play.php?$args;
  }

  # Request channel logo for the provided channel ID
  location ~ ^/logo/radio_TFT/([0-9]+)\.jpg$ {
    rewrite ^/logo/radio_TFT/([0-9]+)\.jpg$ /logo.php?id=$1 break;
    proxy_pass http://127.0.0.1:8080;
  }

}
